# VS Code's Dark Modern, the dark side's default theme. docs/devel/themes.md says what each token colours.
name = "VS Code Dark Modern"
kind = "dark"

[colors]
bg = "#1f1f1f"
fg = "#cccccc"
fg_muted = "#9d9d9d"
border = "#2b2b2b"
bg_chrome = "#181818"
fg_chrome = "#cccccc"
bg_overlay = "#222222"
backdrop = "#00000073"
shadow = "#00000099"
selected = "#04395e"
accent = "#4daafc"
add = "#2ea043"
del = "#f85149"
find = "#9e6a03"
find_current = "#515c6a"
find_current_fg = "#cccccc"
attention = "#cca700"
danger = "#f14c4c"
warn_bg = "#c72e0f"
warn_fg = "#ffffff"
state_open = "#3fb950"
state_done = "#ab7df8"
state_closed = "#f85149"
state_muted = "#9d9d9d"

[syntax]
keyword = "#569cd6"
string = "#ce9178"
comment = "#6a9955"
constant = "#b5cea8"
entity = "#dcdcaa"
tag = "#4ec9b0"

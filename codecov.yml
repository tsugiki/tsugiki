# Codecov shows coverage on each PR. It only reports: CI's own gates decide whether a PR passes (ADR 0009),
# so these statuses are informational and an outage at Codecov can't block a merge.

# Codecov can't tell how many uploads a commit will get, so it would report from the first ones. CI sends
# four: `vitest` and `rust-coverage` on Windows and macOS. Change this when ci.yml changes those uploads.
#
# A PR that changes only `ui/` and docs sends no Rust upload, so the `rust` flag carries main's two forward.
# Codecov counts those two toward the four (`len(report.sessions)` in its worker). On a PR that runs Rust,
# they count until its first Rust upload replaces them. The comment can then show main's Rust figure until
# the PR's own arrives, and keeps showing it if both Rust uploads are cancelled. Any other cancelled upload
# means no report until a rerun sends it.
codecov:
  notify:
    after_n_builds: 4

flags:
  rust:
    carryforward: true

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  after_n_builds: 4
  layout: "condensed_header, diff, flags, files"
  require_changes: false

[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/token", "crates/webview-keys", "crates/test-git"]

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/tsugiki/tsugiki"

[workspace.dependencies]
divan = { package = "codspeed-divan-compat", version = "=6.0.0" }
insta = "1.43.1"
log = "0.4.35"
# `trace` is for the store's plan check. It stays on here so tests and builds share one `rusqlite`.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "trace"] }
# The version ureq uses, named only to read its certificate errors. ureq turns on the features it needs.
rustls = { version = "0.23.46", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.5"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
open = "5.4.5"
# Ends each git the mirrors start with the helpers it started (#208): a Windows job object, or a process group
# elsewhere.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "creation-flags", "job-object", "process-group"] }
# The free space on a disk, which a clone checks first (#171).
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
# Compares the latest release's tag with the running version (#274). Tauri already brings it in.
semver = { version = "1.0.28", default-features = false, features = ["std"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
toml_edit = { version = "0.25.17", features = ["serde"] }
# The highlighter (#153): the parser, the type each grammar hands it, and the grammars.
tree-sitter = "0.27.2"
tree-sitter-language = "0.1.9"
tree-sitter-c = "0.24.2"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rst = "0.2.0"
tree-sitter-rust = "0.24.2"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tsugiki-core = { path = "crates/core" }
tsugiki-test-git = { path = "crates/test-git" }
tsugiki-token = { path = "crates/token" }
tsugiki-webview-keys = { path = "crates/webview-keys" }
url = "2.5.8"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
webview2-com = "0.39.1" # The version Tauri's window hands its controller in.
windows-core = "0.62.2" # The version webview2-com uses.
# The version process-wrap uses, named only for its process creation flags.
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Threading"] }
# The version process-wrap uses, named only for the signal that kills git's process group and its error.
libc = "0.2.191"

# The rules the gate enforces. Each one says why it is here, and a test in crates/app/tests/rules.rs fails
# when one doesn't. Several picks come from easy-peasy-rust (MIT,
# https://github.com/skatromb/easy-peasy-rust).
[workspace.lints.rust]
unsafe_code = "deny" # A leaked token can reach python/cpython. Core, app and token forbid it; see webview-keys.
unused_results = "deny" # A dropped value is often a dropped failure, so say `let _ =` when it is meant.

[workspace.lints.clippy]
all = { level = "warn", priority = -1 } # Clippy's default set, which CI turns into errors.

# Failures are returned, so the status bar can say what went wrong and the app stays up.
expect_used = "deny" # Panics. A failure the user can meet gets an error instead.
indexing_slicing = "deny" # Panics out of bounds, so use `get`.
panic = "deny" # Panics.
panic_in_result_fn = "deny" # A function returning `Result` has already said how it fails.
string_slice = "deny" # Panics off a `char` boundary, and GitHub's text isn't ASCII.
todo = "deny" # Unfinished code must not ship.
unimplemented = "deny" # Unfinished code must not ship.
unreachable = "deny" # Panics, and GitHub's data can reach a case that looked impossible.
unwrap_in_result = "deny" # A function returning `Result` should return this failure too.
unwrap_used = "deny" # Panics, and says less than `expect` about why.

# Errors keep what caused them, so the local log can say what failed.
let_underscore_must_use = "deny" # `let _ =` on a `Result` hides a failure, so it needs a stated reason.
map_err_ignore = "deny" # Keep the source error, and say why in a reason when it really has no use.

# Numbers and ordering behave the same way on every run.
as_conversions = "deny" # `as` truncates silently, so use `From` or `TryFrom`.
iter_over_hash_type = "deny" # Hash order changes per run, which would make view models flicker.

# Matches and shared data stay honest as the code grows.
clone_on_ref_ptr = "deny" # `Arc::clone(&x)` shows a shared handle, where `x.clone()` looks like a copy.
rc_mutex = "deny" # `Rc` is for one thread, where `Mutex` has no job.
wildcard_enum_match_arm = "deny" # A new variant should break each match that has to handle it.

# Code stays small enough to read.
cognitive_complexity = "deny" # Hard-to-follow functions hide bugs. The threshold is in clippy.toml.
fn_params_excessive_bools = "deny" # `f(true, false)` says nothing at the call, so use an enum.
struct_excessive_bools = "deny" # Several bools allow invalid states, so use an enum.

# Output goes to the UI or the local log, and nowhere a user can't see it.
dbg_macro = "deny" # A debugging leftover.
print_stderr = "deny" # A release build on Windows has no console, so this text vanishes.
print_stdout = "deny" # A release build on Windows has no console, so this text vanishes.

# Exceptions are visible, and go away when they stop being needed.
allow_attributes = "deny" # `#[expect]` fails once the lint stops firing, and `#[allow]` never does.
allow_attributes_without_reason = "deny" # Each exception says why.

# Debug builds and tests, which `docs/build-costs.md` measures.
[profile.dev]
debug = "line-tables-only" # A panic's backtrace keeps file and line. A debugger loses local variables.

[profile.dev.package."*"]
debug = false # Most of the debug info is theirs, and nobody here steps through a dependency.

# What a release ships. `docs/build-costs.md` has the measurements, and says why `lto` and `panic = "abort"`
# aren't here.
[profile.release]
codegen-units = 1 # A smaller download, for a longer build.
strip = true # A smaller dmg. A panic's message and place reach the log without symbols.

# Gruvbox Dark Hard, from the palette in github.com/morhetz/gruvbox: its hard dark background, `bg0_h`,
# with the bright colours that palette gives the dark side. docs/devel/themes.md says what each token colours.
name = "Gruvbox Dark Hard"
kind = "dark"

[colors]
bg = "#1d2021"
fg = "#ebdbb2"
fg_muted = "#a89984"
border = "#3c3836"
bg_chrome = "#282828"
fg_chrome = "#ebdbb2"
bg_overlay = "#282828"
backdrop = "#00000073"
shadow = "#00000099"
selected = "#504945"
selection_active = "#504945"
selection_inactive = "#3c3836"
focus_border = "#458588"
accent = "#83a598"
add = "#b8bb26"
del = "#fb4934"
find = "#d79921"
find_current = "#665c54"
find_current_fg = "#fbf1c7"
attention = "#fabd2f"
danger = "#fb4934"
warn_bg = "#af3a03"
warn_fg = "#fbf1c7"
state_open = "#b8bb26"
state_done = "#d3869b"
state_closed = "#fb4934"
state_muted = "#928374"

[syntax]
keyword = "#fb4934"
string = "#b8bb26"
comment = "#928374"
constant = "#d3869b"
entity = "#fabd2f"
tag = "#8ec07c"

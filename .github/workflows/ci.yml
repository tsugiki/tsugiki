# The checks of ADR 0009, on every push to main, and on each push to a PR the checks that read what changed.
# On Windows each is its own job, and a job's name is the npm script it runs, so a PR shows what failed and
# where. macOS runs only what can differ there, as steps of one job: GitHub cancels a macOS job that waits too
# long for a runner, and the more jobs a run has, the likelier that gets (ADR 0009).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The Windows and macOS coverage jobs install the same version. No name here starts with CARGO_:
  # rust-cache hashes those into its key, so a new value would miss every Rust cache main saved.
  LLVM_COV_TOOL: cargo-llvm-cov@0.9.1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which checks run, as the list `jobs` that each job's `if:` reads: scripts/scope.ts gives each path
  # the jobs that read it, and `just check` applies the same rule. On a PR it takes the jobs the PR needs
  # against its base, and drops those whose inputs are the same as in the tree the PR's last run that passed
  # tested. Docs need none of them, and a PR that only sets the version needs only deny and machete:
  # `just release` waits for main's run, which runs the rest. A push to main runs every check.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # finds the PR's last run that passed, and downloads what it tested
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      # On a PR, the whole history, so git can merge the last run's head and base again, whatever they
      # were. `'0'` is a string, which an expression counts as true, where the number 0 would pick the 1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Only this repository's runs count: a fork's run could say it tested anything. Without one, or its
      # tested.json, the step leaves nothing and the whole PR counts.
      - name: Find what the PR's last run that passed tested
        if: >-
          ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          run=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=pull_request -f status=success -f branch="$HEAD_REF" -F per_page=20 \
            --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\")][0].id // empty")
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name tested --dir "$RUNNER_TEMP/last-passed"
          fi
      - id: jobs
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/changes.ts --pr "$RUNNER_TEMP/last-passed/tested.json" "$RUNNER_TEMP/tested.json"
          else
            node scripts/changes.ts --every
          fi
      # What this run tested, for the PR's runs after it. A run that fails leaves it too, and they skip it.
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested
          path: ${{ runner.temp }}/tested.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  # Runs on a docs-only PR too, because that's where a wide line of Markdown lands.
  doc-width:
    name: doc-width
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm run doc-width

  # Runs the hooks in .pre-commit-config.yaml on every PR, docs-only and ui-only too: typos reads the docs,
  # and any PR can change a workflow. CONTRIBUTING.md pins the same pre-commit.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pipx install pre-commit==4.7.0
      # The hooks' environments, which a first run builds from the pinned commits. actionlint's is a Go build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: npm run pre-commit

  # `rust-coverage` runs every Rust test, the bindings check among them, so neither has a job of its own. Its
  # log says whether a test failed or coverage fell short.
  rust:
    name: ${{ matrix.check }} (windows-latest)
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'rust') }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [rustfmt, clippy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - if: ${{ matrix.check != 'rustfmt' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.check }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run ${{ matrix.check }}

  # These read Cargo.lock, the manifests and the sources, and build nothing, so one OS is enough. The action
  # holds each release's checksum, and `fallback: none` stops it installing anything it can't verify.
  dependencies:
    name: ${{ matrix.check }}
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'dependencies') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: deny
            tool: cargo-deny@0.20.2
          - check: machete
            tool: cargo-machete@0.9.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: ${{ matrix.tool }}
          fallback: none
      - run: npm run ${{ matrix.check }}

  # A PR that sets a version fails here without its changelog section, before anyone tags it (ADR 0012). It
  # takes seconds, so it runs on every PR, as doc-width and pre-commit do.
  release-check:
    name: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm run release-check
      # The Release workflow rehearses only a PR from a `release/` branch of this repository, so a PR that
      # sets a version or changes that workflow has to come from one (ADR 0012). HEAD^1 is the PR's base.
      - name: A new version or Release workflow comes from a release/ branch
        if: >-
          ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'release/') &&
          github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- .github/workflows/release.yml; then
            echo "::error::Change release.yml on a release/ branch, so the Release workflow rehearses it."
            exit 1
          fi
          version() {
            node -e 'import("./scripts/release-notes.ts").then(({ workspaceVersion }) =>
              console.log(workspaceVersion(require("node:fs").readFileSync(0, "utf8"))))'
          }
          # Each in an assignment of its own, so a failed node stops the step. Inside the test, two failures
          # would both read as "" and match.
          base=$(git show HEAD^1:Cargo.toml | version) || exit 1
          head=$(version < Cargo.toml) || exit 1
          if [ "$base" != "$head" ]; then
            echo "::error::Set the version on a release/ branch, so the Release workflow rehearses it."
            exit 1
          fi

  # jscpd compares the Rust under crates/ with itself, and the UI and the scripts with themselves, so a change
  # to either runs it. It takes a second, so one job runs both scans.
  dupes:
    name: dupes
    needs: [changes]
    if: >-
      ${{ contains(fromJSON(needs.changes.outputs.jobs), 'rust') ||
      contains(fromJSON(needs.changes.outputs.jobs), 'ui') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # The root's packages alone, jscpd among them: the scan needs nothing of the ui workspace.
      - run: npm ci --workspaces=false
      - run: npm run dupes

  # Codecov carries the last Rust figure forward on a run that skips this job (codecov.yml).
  rust-coverage:
    name: rust-coverage (windows-latest)
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'rust') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: ${{ env.LLVM_COV_TOOL }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run rust-coverage
      # Also when the gate fails: that's when the uncovered lines are worth seeing.
      - if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/lcov.info
          disable_search: true
          flags: rust
          name: rust-windows-latest

  ui:
    name: ${{ matrix.check }} (windows-latest)
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'ui') }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [eslint, prettier, svelte-check, vitest, token-deps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}
      # Also when the gate fails: that's when the uncovered lines are worth seeing.
      - if: ${{ !cancelled() && matrix.check == 'vitest' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .temp/vitest-coverage/lcov.info
          disable_search: true
          flags: typescript
          name: typescript-windows-latest

  playwright:
    name: Playwright ${{ matrix.browser }} (windows-latest)
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'ui') }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      - name: Drive the built UI
        run: npm run e2e -w ui -- --project=${{ matrix.browser }}
      - name: Keep the Playwright traces of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}-windows-latest
          path: .temp/playwright-results
          # The folder's name starts with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore

  # What can differ on macOS, as steps of one job so a run needs one macOS runner. A failed check doesn't stop
  # the checks after it. As on Windows, Rust's coverage gate runs the tests and the bindings check. The Rust
  # steps run when `jobs` lists `rust`, and the UI ones when it lists `ui`.
  macos:
    name: checks (macos-latest)
    needs: [changes]
    if: >-
      ${{ contains(fromJSON(needs.changes.outputs.jobs), 'rust') ||
      contains(fromJSON(needs.changes.outputs.jobs), 'ui') }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RUST_STEPS: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'rust') }}
      UI_STEPS: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'ui') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the Rust toolchain from rust-toolchain.toml
        if: ${{ env.RUST_STEPS == 'true' }}
        run: rustup toolchain install
      - if: ${{ env.RUST_STEPS == 'true' }}
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: ${{ env.LLVM_COV_TOOL }}
      - if: ${{ env.RUST_STEPS == 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - if: ${{ env.UI_STEPS == 'true' }}
        run: npx playwright install webkit
      - name: clippy
        if: ${{ !cancelled() && env.RUST_STEPS == 'true' }}
        run: npm run clippy
      - name: rust-coverage
        if: ${{ !cancelled() && env.RUST_STEPS == 'true' }}
        run: npm run rust-coverage
      # Also when a gate fails: that's when the uncovered lines are worth seeing.
      - if: ${{ !cancelled() && env.RUST_STEPS == 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/lcov.info
          disable_search: true
          flags: rust
          name: rust-macos-latest
      - name: vitest
        if: ${{ !cancelled() && env.UI_STEPS == 'true' }}
        run: npm run vitest
      - if: ${{ !cancelled() && env.UI_STEPS == 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .temp/vitest-coverage/lcov.info
          disable_search: true
          flags: typescript
          name: typescript-macos-latest
      - name: Playwright webkit
        if: ${{ !cancelled() && env.UI_STEPS == 'true' }}
        run: npm run e2e -w ui -- --project=webkit
      - name: Keep the Playwright traces of a failed run
        if: ${{ failure() && env.UI_STEPS == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-webkit-macos-latest
          path: .temp/playwright-results
          # The folder's name starts with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore

  # The one check a ruleset requires, so jobs can be added here without changing the ruleset.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs:
      - changes
      - doc-width
      - pre-commit
      - rust
      - dependencies
      - release-check
      - dupes
      - rust-coverage
      - ui
      - playwright
      - macos
    runs-on: ubuntu-latest
    steps:
      # A job may skip only when `changes` left out of `jobs` what it reads. The macOS and dupes jobs read
      # both, and the jobs with no `if:` always run. A job this table doesn't name fails it, so a new one gets
      # a line.
      - name: Every job succeeded, or skipped because the change doesn't reach what it reads
        env:
          JOBS: ${{ needs.changes.outputs.jobs }}
          NEEDS: ${{ toJSON(needs) }}
        # A failed jq stops the step here, as when `changes` failed and left no `jobs`: read from
        # `<(jq ...)`, it would leave the loop nothing to check.
        run: |
          results=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          while read -r job result; do
            case "$job" in
              changes | doc-width | pre-commit | release-check) reads='"always"' ;;
              rust | rust-coverage) reads='"rust"' ;;
              dependencies) reads='"dependencies"' ;;
              ui | playwright) reads='"ui"' ;;
              macos | dupes) reads='"rust", "ui"' ;;
              *) echo "CI passed doesn't know what $job reads"; exit 1 ;;
            esac
            listed=$(jq -r "[\"always\"] + . | any(.[]; IN($reads))" <<< "$JOBS")
            case "$result $listed" in
              "success "* | "skipped false") ;;
              *) echo "$job ended with: $result"; exit 1 ;;
            esac
          done <<< "$results"

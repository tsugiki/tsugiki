# The checks of ADR 0009, on every push to main and every PR that changes more than docs.
# Each is its own job, and a job's name is the npm script it runs, so a PR shows what failed and where.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the checks run. It compares the PR's merge commit with its base, and a rename counts
  # as both of its paths. Any path it can't read as docs runs the checks, and so does a push to main.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - if: ${{ github.event_name == 'pull_request' }}
        id: diff
        run: |
          paths=$(git diff --no-renames --name-only HEAD^1 HEAD)
          printf '%s\n' "$paths"
          if printf '%s\n' "$paths" | grep -qvE '^docs/|\.md$'; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: ${{ matrix.check }} (${{ matrix.os }})
    needs: [changes]
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        check: [rustfmt, clippy, cargo-test, stale-bindings]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - if: ${{ matrix.check != 'rustfmt' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.check }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run ${{ matrix.check }}

  # These read Cargo.lock, the manifests and the sources, and build nothing, so one OS is enough. The action
  # holds each release's checksum, and `fallback: none` stops it installing anything it can't verify.
  dependencies:
    name: ${{ matrix.check }}
    needs: [changes]
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: deny
            tool: cargo-deny@0.20.2
          - check: machete
            tool: cargo-machete@0.9.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: ${{ matrix.tool }}
          fallback: none
      - run: npm run ${{ matrix.check }}

  # A PR that sets a version fails here without its changelog section, before anyone tags it (ADR 0012).
  release-check:
    name: release-check
    needs: [changes]
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm run release-check

  rust-coverage:
    name: rust-coverage (${{ matrix.os }})
    needs: [changes]
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run rust-coverage
      # Also when the gate fails: that's when the uncovered lines are worth seeing.
      - if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/lcov.info
          disable_search: true
          flags: rust
          name: rust-${{ matrix.os }}

  ui:
    name: ${{ matrix.check }} (${{ matrix.os }})
    needs: [changes]
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        check: [eslint, prettier, svelte-check, vitest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}
      # Also when the gate fails: that's when the uncovered lines are worth seeing.
      - if: ${{ !cancelled() && matrix.check == 'vitest' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ui/coverage/lcov.info
          disable_search: true
          flags: typescript
          name: typescript-${{ matrix.os }}

  playwright:
    name: Playwright ${{ matrix.browser }} (${{ matrix.os }})
    needs: [changes]
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      - name: Drive the built UI
        run: npm run e2e -w ui -- --project=${{ matrix.browser }}
      - name: Keep the Playwright traces of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.os }}
          path: ui/test-results
          if-no-files-found: ignore

  # The one check a ruleset requires, so jobs can be added here without changing the ruleset.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, rust, dependencies, release-check, rust-coverage, ui, playwright]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded, or skipped on a docs-only PR
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$DOCS_ONLY $result" in
              *" success" | "true skipped") ;;
              *) echo "A job ended with: $result"; exit 1 ;;
            esac
          done

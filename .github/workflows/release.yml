# The release workflow of ADR 0012. Pushing a tag vX.Y.Z on main builds the installers, attests each one and
# uploads them to a draft release, then checks the draft's files the way a user would. Publishing stays a
# person's job, after the checks in ADR 0012.
#
# No job restores a cache: anything a pull request's run saved could otherwise end up in an installer.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Each job asks for its own, out of contents: write, id-token: write and attestations: write (ADR 0012).
permissions: {}

jobs:
  check:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: The tag matches Cargo.toml, and CHANGELOG.md has its section
        run: node scripts/release-check.ts "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # It builds its own release with a debugging port open, so the installers below are separate builds.
  smoke:
    name: npm run smoke
    needs: [check]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: npm ci
      - run: npm run smoke

  build:
    name: build (${{ matrix.os }})
    needs: [smoke]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            installers: target/release/bundle/nsis/*.exe
          - os: macos-latest
            installers: target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: npm ci
      - run: npx tauri build
      # After the last step that changes the files. Signing would have to come before this (#6).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.installers }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

  draft:
    name: upload to a draft release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo tsugiki/tsugiki --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  verify:
    name: verify the draft's files
    needs: [draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only a token that can write sees a draft.
      contents: write
      attestations: read
    steps:
      - name: Download every asset and check its attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo tsugiki/tsugiki --dir assets
          for file in assets/*; do
            gh attestation verify "$file" --repo tsugiki/tsugiki \
              --signer-workflow tsugiki/tsugiki/.github/workflows/release.yml
          done

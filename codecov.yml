# Codecov shows coverage on each PR. It only reports: CI's own gates decide whether a PR passes (ADR 0009),
# so these statuses are informational and an outage at Codecov can't block a merge.

# Codecov can't tell how many uploads a commit will get, so it would report from the first ones. CI sends
# four: `vitest` and `rust-coverage` on Windows and macOS. Change this when ci.yml changes those uploads.
#
# A run that skips the Rust jobs sends no Rust upload, so the `rust` flag carries the parent commit's two
# forward, and a run that skips the UI jobs does the same with `typescript`. Codecov counts carried uploads
# toward the four (`len(report.sessions)` in its worker), until the run's own uploads replace them. The
# comment can then show the carried figure until the run's own arrives, and keeps showing it if both of a
# flag's uploads are cancelled. Any other cancelled upload means no report until a rerun sends it. A run
# that skips both, as for a change to docs alone or one that only sets the version, sends no upload, so it
# gets no report.
codecov:
  notify:
    after_n_builds: 4

flags:
  rust:
    carryforward: true
  typescript:
    carryforward: true

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  after_n_builds: 4
  layout: "condensed_header, diff, flags, files"
  require_changes: false

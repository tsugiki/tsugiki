[package]
name = "tsugiki-lsp"
description = "A client that talks to a language server over its standard streams, for Tsugiki's Go to definition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Our own LSP types on serde, not `lsp-types`: that crate took 5.9 s of a debug build on its own, for the
# dozen types this crate reads (#677).
[dependencies]
log.workspace = true
process-wrap.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true
windows.workspace = true

[features]
# Makes `testing`, a fake server over in-memory pipes, reachable from other crates' tests. Only
# `[dev-dependencies]` turn it on, so no release build has it.
testing = []

# A fake server as a program, which `scripts/test-servers.ts` builds for the core's tests to start. Built with
# `testing` alone, so no release build has it, and it has no unit tests.
[[bin]]
name = "tsugiki-fake-server"
path = "src/bin/fake_server.rs"
required-features = ["testing"]
test = false
doc = false

[dev-dependencies]
tsugiki-test-git.workspace = true

[lints]
workspace = true

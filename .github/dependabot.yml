# Dependabot proposes new versions of our crates, npm packages, pinned actions and pre-commit hooks. Each
# waits 7 days after a release (`cooldown`), so a release its authors yank in that week doesn't reach us.
#
# Cargo, npm and pre-commit group minor and patch bumps into one weekly PR each, and a major bump gets a PR of
# its own. Tauri stays out of the groups: a PR that changes the Tauri version needs `just smoke` (AGENTS.md),
# and in its own PR that run covers one bump, not the whole week's. Dependabot still proposes Tauri's bumps,
# one PR each.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        exclude-patterns: ["tauri*"]
        update-types: [minor, patch]
    # Three crates follow the version another crate uses, so a bump of one alone doesn't build (#637): Cargo
    # links two copies, and their types don't mix. Dependabot counts 0.62 to 0.100 as a major bump, so the
    # rules skip those and let the compatible releases through.
    ignore:
      # webview2-com follows Tauri's, and windows-core follows webview2-com's. The Tauri PR that moves
      # webview2-com fails in crates/webview-keys, and that PR moves both.
      - dependency-name: webview2-com
        update-types: ["version-update:semver-major"]
      - dependency-name: windows-core
        update-types: ["version-update:semver-major"]
      # windows follows process-wrap's. A process-wrap PR that moves it fails to build, and moves it too.
      - dependency-name: windows
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        exclude-patterns: ["@tauri-apps/*"]
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # crate-ci/typos also tags the other crates it publishes (varcon-core-v5.0.7, typos-dict-v*, ...), and
      # Dependabot reads the highest of those tags as a typos release (#643). typos itself is at 1.x, and only
      # varcon-core is numbered above it, so `>= 2` hides no real release. Revisit if typos reaches 2.0.
      - dependency-name: "https://github.com/crate-ci/typos"
        versions: [">= 2"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

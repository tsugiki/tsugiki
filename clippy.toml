# Settings for the lints in Cargo.toml. Each one says why it is here, and a test in crates/app/tests/rules.rs
# fails when one doesn't. Several picks come from easy-peasy-rust (MIT,
# https://github.com/skatromb/easy-peasy-rust).

# A failing test should stop with a panic, and may print what it found.
allow-dbg-in-tests = true # Tests may debug.
allow-expect-in-tests = true # A failed setup step ends the test.
allow-indexing-slicing-in-tests = true # A wrong index ends the test.
allow-panic-in-tests = true # That is how a test fails.
allow-print-in-tests = true # Test output is for whoever runs it.
allow-unwrap-in-tests = true # A failed setup step ends the test.

# Code stays small enough to read.
cognitive-complexity-threshold = 12 # About where a function needs splitting, from easy-peasy-rust.
max-fn-params-bools = 0 # No keyword arguments in Rust, so a bool at the call says nothing.
max-struct-bools = 1 # Two bools make four states, and a struct rarely has four valid ones.
too-many-arguments-threshold = 4 # More usually means a missing struct, and methods count `self`.

# Three files touch the outside world, so tests can replace all of it (ADR 0009): the network and gh in the
# token crate (ADR 0019), git in the core, a language server in the LSP client (ADR 0020). Only `store` holds
# the database, so its tables stay its own (#88).
disallowed-types = [ # The network and gh stay in crates/token/src/live.rs, git in the core's github/live.rs.
    { path = "std::process::Command", reason = "Run gh in crates/token/src/live.rs, git in crates/core/src/github/live.rs, a language server in crates/lsp/src/process.rs" },
    { path = "std::net::TcpStream", reason = "Reach the network in crates/token/src/live.rs" },
    { path = "std::net::UdpSocket", reason = "Reach the network in crates/token/src/live.rs" },
    { path = "ureq::Agent", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::RequestExt", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::config::Config", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "rusqlite::Connection", reason = "Reach the database through crates/core/src/store", allow-invalid = true },
]
disallowed-methods = [ # ureq's shortcuts reach the network without naming an `Agent`.
    { path = "ureq::agent", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::config::Config::new_agent", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::connect", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::delete", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::get", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::head", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::options", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::patch", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::post", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::put", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::run", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    { path = "ureq::trace", reason = "Reach the network in crates/token/src/live.rs", allow-invalid = true },
    # One caller asks gh for the token, so the log hides it and a failure says how to sign in (ADR 0019).
    { path = "tsugiki_token::Token::from_gh", reason = "Read the token with tsugiki_core::token::read_token", allow-invalid = true },
    # A failed run's files stay in sight in `.temp`, not lost among the system's.
    { path = "std::env::temp_dir", reason = "Put a test's files in .temp at the repo root" },
]

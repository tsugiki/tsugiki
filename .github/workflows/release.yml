# The release workflow of ADR 0012. Pushing a tag vX.Y.Z on main builds the Windows zip and the macOS dmg,
# attests each one and uploads them to a draft release, then checks the draft's files the way a user would.
# Publishing stays a person's job, after the checks in ADR 0012.
#
# A pull request from a `release/` branch of this repository, such as the one that sets a version, rehearses
# the release: the checks, the smoke test and the builds run, and nothing gets attested or uploaded. A pull
# request from any other branch, or from a fork, starts a run that skips every job, and CI fails it if it sets
# a version or changes this file. Try a change to this file on a `release/` branch, because a real run's
# attestations stay in a public log for good.
#
# No job restores a cache: anything a pull request's run saved could otherwise end up in a download.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main]

# A newer run for the same PR or tag cancels the older one. A new push makes a rehearsal out of date, and when
# a tag is deleted and pushed again, the old run would upload its files under the new tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Each job asks for its own, out of contents: write, id-token: write and attestations: write (ADR 0012).
permissions: {}

# The repository each draft goes to, and whose release workflow must have signed each download.
env:
  REPO: tsugiki/tsugiki

jobs:
  check:
    name: check the version
    # The other jobs need this one, so a pull request from any other branch, or from a fork, skips them all.
    if: >-
      ${{ github.event_name == 'push' || (startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        if: ${{ github.event_name == 'push' }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: The tag matches Cargo.toml, and CHANGELOG.md has its section
        if: ${{ github.event_name == 'push' }}
        run: node scripts/release-check.ts "$GITHUB_REF_NAME" > release-notes.md
      - name: CHANGELOG.md has a section for Cargo.toml's version
        if: ${{ github.event_name != 'push' }}
        run: node scripts/release-check.ts > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # It builds its own release with a debugging port open, so the downloads below are separate builds. The
  # builds don't wait for it: the attest job's `needs` lists it, and must list each pre-release suite added.
  smoke:
    name: npm run smoke
    needs: [check]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: npm ci
      # Since the windows-2025-vs2026 image of 2026-11-16, Tsugiki's page and `gh` took 19 to 37 s to answer
      # where they took 3 s, and `gh auth token` ran past Tsugiki's 30 s (#976). The first step shows whether
      # Defender scans files as they open, and how long `gh` takes to start cold. The second leaves out of the
      # scan what the smoke test runs.
      - name: Show Defender's state and how long gh takes to start
        shell: pwsh
        run: |
          Get-MpComputerStatus |
            Format-List RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled, AMRunningMode
          $cold = Measure-Command { gh --version | Out-Null }
          $warm = Measure-Command { gh --version | Out-Null }
          "gh --version took $([int]$cold.TotalMilliseconds) ms cold and $([int]$warm.TotalMilliseconds) ms warm"
      - name: Leave the smoke test's programs and files out of Defender's scan
        shell: pwsh
        run: |
          if ((Get-MpComputerStatus).RealTimeProtectionEnabled) {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
            Add-MpPreference -ExclusionProcess tsg.exe, msedgewebview2.exe, gh.exe, git.exe
            "Defender scans files as they open: left out $env:GITHUB_WORKSPACE and the smoke test's programs."
          } else {
            "Defender doesn't scan files as they open, so it can't be what slows the smoke test."
          }
      - run: npm run smoke

  # Beside the smoke test, not after it, which halves the run. The attest job needs both, so a failed smoke
  # test still stops the release, at the cost of the builds' runner minutes.
  build:
    name: build (${{ matrix.os }})
    needs: [check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: target/release/bundle/portable/*.zip
          - os: macos-latest
            files: target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: npm ci
      - run: npx tauri build -- --locked
      - name: Zip the portable copy, then start it from the zip
        if: ${{ runner.os == 'Windows' }}
        run: node scripts/portable-zip.ts --try
      - name: The app in the dmg is ad-hoc signed
        if: ${{ runner.os == 'macOS' }}
        run: |
          hdiutil attach target/release/bundle/dmg/*.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Tsugiki.app"
          codesign --display --verbose=2 "$RUNNER_TEMP/dmg/Tsugiki.app" 2>&1 | grep -F 'Signature=adhoc'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: download-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Apart from the builds, so the install and build scripts they run never hold the right to attest. It comes
  # after the last step that changes the files: signing would have to come first (#6). A rehearsal stops
  # here: the jobs after this one need it, so they skip with it.
  attest:
    name: attest the downloads
    needs: [smoke, build]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: download-*
          merge-multiple: true
          path: downloads
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: downloads/*

  draft:
    name: upload to a draft release
    needs: [attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: download-*
          merge-multiple: true
          path: downloads
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      # GitHub would take a second draft for the tag, and the job after this could then check the wrong one.
      - name: No release has this tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$REPO" > /dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME exists already. Delete the draft, then run this again."
            exit 1
          fi
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" downloads/*
          --repo "$REPO" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  verify:
    name: verify the draft's files
    needs: [draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only a token that can write sees a draft.
      contents: write
      attestations: read
    steps:
      - name: Download every asset and check its attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$REPO" --dir assets
          for file in assets/*; do
            gh attestation verify "$file" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml"
          done

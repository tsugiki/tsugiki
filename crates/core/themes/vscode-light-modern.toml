# VS Code's Light Modern, the light side's default theme. docs/devel/themes.md says what each token colours.
name = "VS Code Light Modern"
kind = "light"

[colors]
bg = "#ffffff"
fg = "#3b3b3b"
fg_muted = "#767676"
border = "#e5e5e5"
bg_chrome = "#f8f8f8"
fg_chrome = "#3b3b3b"
bg_overlay = "#f8f8f8"
backdrop = "#00000026"
shadow = "#00000029"
selected = "#e8e8e8"
accent = "#005fb8"
add = "#48a14d"
del = "#e51400"
find = "#f8c94a"
find_current = "#a8ac94"
find_current_fg = "#3b3b3b"
attention = "#bf8803"
danger = "#e51400"
warn_bg = "#c72e0f"
warn_fg = "#ffffff"
state_open = "#1a7f37"
state_done = "#8250df"
state_closed = "#d1242f"
state_muted = "#767676"

[syntax]
keyword = "#0000ff"
string = "#a31515"
comment = "#008000"
constant = "#098658"
entity = "#795e26"
tag = "#267f99"

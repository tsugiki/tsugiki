# The checks of ADR 0009, on every push to main and every PR that changes more than docs. A PR that changes
# only `ui/` and docs skips the Rust ones.
# On Windows each is its own job, and a job's name is the npm script it runs, so a PR shows what failed and
# where. macOS runs only what can differ there, as steps of one job: GitHub cancels a macOS job that waits too
# long for a runner, and the more jobs a run has, the likelier that gets (ADR 0009).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which checks run. It compares the PR's merge commit with its base, and a rename counts as both
  # of its paths. `docs-only` skips every check but doc-width. `ui-only`, when each path is docs or under
  # `ui/`, skips the Rust ones. scripts/scope.ts holds the rule, which `just check` applies too. A push to
  # main sets neither, so it runs every check.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
      ui-only: ${{ steps.diff.outputs.ui-only }}
    steps:
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - if: ${{ github.event_name == 'pull_request' }}
        id: diff
        run: node scripts/changes.ts HEAD^1 HEAD

  # Runs on a docs-only PR too, because that's where a wide line of Markdown lands.
  doc-width:
    name: doc-width
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm run doc-width

  rust:
    name: ${{ matrix.check }} (windows-latest)
    needs: [changes]
    if: ${{ needs.changes.outputs.ui-only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [rustfmt, clippy, cargo-test, stale-bindings]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - if: ${{ matrix.check != 'rustfmt' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.check }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run ${{ matrix.check }}

  # These read Cargo.lock, the manifests and the sources, and build nothing, so one OS is enough. The action
  # holds each release's checksum, and `fallback: none` stops it installing anything it can't verify.
  dependencies:
    name: ${{ matrix.check }}
    needs: [changes]
    if: ${{ needs.changes.outputs.ui-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: deny
            tool: cargo-deny@0.20.2
          - check: machete
            tool: cargo-machete@0.9.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: ${{ matrix.tool }}
          fallback: none
      - run: npm run ${{ matrix.check }}

  # A PR that sets a version fails here without its changelog section, before anyone tags it (ADR 0012).
  release-check:
    name: release-check
    needs: [changes]
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm run release-check
      # The Release workflow rehearses only a PR from a `release/` branch of this repository, so a PR that
      # sets a version or changes that workflow has to come from one (ADR 0012). HEAD^1 is the PR's base.
      - name: A new version or Release workflow comes from a release/ branch
        if: >-
          ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'release/') &&
          github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- .github/workflows/release.yml; then
            echo "::error::Change release.yml on a release/ branch, so the Release workflow rehearses it."
            exit 1
          fi
          if [ "$(git show HEAD^1:Cargo.toml | grep -m1 '^version = ')" != "$(grep -m1 '^version = ' Cargo.toml)" ]; then
            echo "::error::Set the version on a release/ branch, so the Release workflow rehearses it."
            exit 1
          fi

  # Codecov carries main's Rust figure forward on a PR that skips this job (codecov.yml).
  rust-coverage:
    name: rust-coverage (windows-latest)
    needs: [changes]
    if: ${{ needs.changes.outputs.ui-only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run rust-coverage
      # Also when the gate fails: that's when the uncovered lines are worth seeing.
      - if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/lcov.info
          disable_search: true
          flags: rust
          name: rust-windows-latest

  ui:
    name: ${{ matrix.check }} (windows-latest)
    needs: [changes]
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [eslint, prettier, svelte-check, vitest, token-deps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}
      # Also when the gate fails: that's when the uncovered lines are worth seeing.
      - if: ${{ !cancelled() && matrix.check == 'vitest' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .temp/vitest-coverage/lcov.info
          disable_search: true
          flags: typescript
          name: typescript-windows-latest

  playwright:
    name: Playwright ${{ matrix.browser }} (windows-latest)
    needs: [changes]
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      - name: Drive the built UI
        run: npm run e2e -w ui -- --project=${{ matrix.browser }}
      - name: Keep the Playwright traces of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}-windows-latest
          path: .temp/playwright-results
          # The folder's name starts with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore

  # What can differ on macOS, as steps of one job so a run needs one macOS runner. A failed check doesn't stop
  # the checks after it. Rust's coverage gate runs the tests, so there's no separate `cargo-test`. A `ui-only`
  # PR skips the Rust steps.
  macos:
    name: checks (macos-latest)
    needs: [changes]
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the Rust toolchain from rust-toolchain.toml
        if: ${{ needs.changes.outputs.ui-only != 'true' }}
        run: rustup toolchain install
      - if: ${{ needs.changes.outputs.ui-only != 'true' }}
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-llvm-cov@0.9.1
      - if: ${{ needs.changes.outputs.ui-only != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npx playwright install webkit
      - name: clippy
        if: ${{ !cancelled() && needs.changes.outputs.ui-only != 'true' }}
        run: npm run clippy
      - name: rust-coverage
        if: ${{ !cancelled() && needs.changes.outputs.ui-only != 'true' }}
        run: npm run rust-coverage
      # Also when a gate fails: that's when the uncovered lines are worth seeing.
      - if: ${{ !cancelled() && needs.changes.outputs.ui-only != 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/lcov.info
          disable_search: true
          flags: rust
          name: rust-macos-latest
      - name: vitest
        if: ${{ !cancelled() }}
        run: npm run vitest
      - if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .temp/vitest-coverage/lcov.info
          disable_search: true
          flags: typescript
          name: typescript-macos-latest
      - name: Playwright webkit
        if: ${{ !cancelled() }}
        run: npm run e2e -w ui -- --project=webkit
      - name: Keep the Playwright traces of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-webkit-macos-latest
          path: .temp/playwright-results
          # The folder's name starts with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore

  # The one check a ruleset requires, so jobs can be added here without changing the ruleset.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, doc-width, rust, dependencies, release-check, rust-coverage, ui, playwright, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded, or skipped on a docs-only PR, or skipped a Rust check on a ui-only PR
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          UI_ONLY: ${{ needs.changes.outputs.ui-only }}
          NEEDS: ${{ toJSON(needs) }}
        # A failed jq stops the step here: read from `<(jq ...)`, it would leave the loop nothing to check.
        run: |
          results=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          while read -r job result; do
            case "$result $DOCS_ONLY $UI_ONLY $job" in
              "success "* | "skipped true "* | "skipped false true rust" | \
                "skipped false true rust-coverage" | "skipped false true dependencies") ;;
              *) echo "$job ended with: $result"; exit 1 ;;
            esac
          done <<< "$results"

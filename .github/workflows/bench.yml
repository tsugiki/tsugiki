# The benchmarks under CodSpeed's simulation mode (ADR 0017). CodSpeed's own check on the PR
# fails on a regression. This job needs only Linux, so tsugiki-core must build there.
#
# On a PR, the Rust benchmarks run only when the PR changes what CI's Rust checks read (scripts/scope.ts). The
# PR counts against its base, not since its last run: CodSpeed fills a benchmark a run skips with the base's
# figure, so a skipped benchmark the PR changed would hide its regression. The UI benchmarks always run. They
# take a minute, and the ruleset requires CodSpeed's own check, which CodSpeed reports only for a run that
# sent it results.
name: Benchmarks

on:
  pull_request:
  push:
    branches: [main]
  # Lets CodSpeed run past commits, to build its first baseline.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every commit on main gets its own run, because CodSpeed compares a PR with its base commit.
  group: bench-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # CodSpeed authenticates with GitHub's OIDC, so no secret is needed.
    steps:
      # On a PR, the merge commit and its parents, so changes.ts can diff it with its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # Every job on a push to main or a run by hand, which keeps the baseline whole.
      - name: Find what the PR changes against its base
        id: scope
        env:
          MODE: ${{ github.event_name == 'pull_request' && '--base' || '--every' }}
        run: node scripts/changes.ts "$MODE"
      - name: Install the Rust toolchain from rust-toolchain.toml
        if: ${{ contains(fromJSON(steps.scope.outputs.jobs), 'rust') }}
        run: rustup toolchain install
      # install-action has no checksummed manifest for this tool, so it's pinned here instead.
      - name: Install cargo-codspeed 6.0.0
        if: ${{ contains(fromJSON(steps.scope.outputs.jobs), 'rust') }}
        run: |
          curl -fsSL -o cargo-codspeed https://github.com/CodSpeedHQ/codspeed-rust/releases/download/v6.0.0/cargo-codspeed-x86_64-unknown-linux-musl
          echo "99b4ada4e00a0b4e153f5fe50f70844898cbd6f77274cbe29e44bf671e5f85d8  cargo-codspeed" | sha256sum --check
          install -m 755 cargo-codspeed ~/.cargo/bin/cargo-codspeed
          rm cargo-codspeed
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ contains(fromJSON(steps.scope.outputs.jobs), 'rust') }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: cargo codspeed build -p tsugiki-core
        if: ${{ contains(fromJSON(steps.scope.outputs.jobs), 'rust') }}
      - uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        env:
          RUST_BENCHMARKS: ${{ contains(fromJSON(steps.scope.outputs.jobs), 'rust') }}
        with:
          mode: simulation
          run: >-
            if [ "$RUST_BENCHMARKS" = true ]; then cargo codspeed run -p tsugiki-core; fi &&
            npm run bench -w ui

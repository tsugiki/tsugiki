# The checks of ADR 0009, on every PR and every push to main.
# Each is its own job, and a job's name is the npm script it runs, so a PR shows what failed and where.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: ${{ matrix.check }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        check: [rustfmt, clippy, cargo-test, stale-bindings]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - if: ${{ matrix.check != 'rustfmt' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.check }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run ${{ matrix.check }}

  ui:
    name: ${{ matrix.check }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        check: [eslint, prettier, svelte-check, vitest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  playwright:
    name: Playwright ${{ matrix.browser }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      - name: Drive the built UI
        run: npm run e2e -w ui -- --project=${{ matrix.browser }}
      - name: Keep the Playwright traces of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.os }}
          path: ui/test-results
          if-no-files-found: ignore

  # The one check a ruleset requires, so jobs can be added here without changing the ruleset.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [rust, ui, playwright]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do test "$result" = success; done

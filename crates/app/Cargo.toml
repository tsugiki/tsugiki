[package]
name = "tsugiki-app"
description = "The Tauri desktop app around tsugiki-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tsugiki_app"

[[bin]]
name = "tsg"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
log.workspace = true
open.workspace = true
serde.workspace = true
serde_json.workspace = true # `generate_context!` writes code that names it, to hold the plugins' config.
specta.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
# The folder picker, which only the core opens: the window gets no permission for it (ADR 0005).
tauri-plugin-dialog.workspace = true
tauri-specta.workspace = true
tsugiki-core.workspace = true
tsugiki-token.workspace = true # The client and gh that start-up hands the core (ADR 0019).

# A development build writes its scheme to the registry with this. macOS can't register one at run time, and
# the installers register `tsugiki` from tauri.conf.json without it (ADR 0016).
[target.'cfg(windows)'.dependencies]
tauri-plugin-deep-link.workspace = true
tsugiki-webview-keys.workspace = true

[dev-dependencies]
specta-typescript.workspace = true
tauri = { workspace = true, features = ["test"] }
time.workspace = true
tsugiki-test-git.workspace = true

[lints]
workspace = true

# Gruvbox Light Hard, from the palette in github.com/morhetz/gruvbox: its hard light background, `bg0_h`,
# with the faded colours that palette gives the light side. docs/devel/themes.md says what each token colours.
name = "Gruvbox Light Hard"
kind = "light"

[colors]
bg = "#f9f5d7"
fg = "#3c3836"
fg_muted = "#7c6f64"
border = "#ebdbb2"
bg_chrome = "#fbf1c7"
fg_chrome = "#3c3836"
bg_overlay = "#fbf1c7"
backdrop = "#00000026"
shadow = "#00000029"
selected = "#ebdbb2"
selection_active = "#ebdbb2"
selection_inactive = "#f2e5bc"
focus_border = "#076678"
accent = "#076678"
add = "#79740e"
del = "#9d0006"
find = "#d79921"
find_current = "#d5c4a1"
find_current_fg = "#282828"
attention = "#b57614"
danger = "#9d0006"
warn_bg = "#af3a03"
warn_fg = "#fbf1c7"
state_open = "#79740e"
state_done = "#8f3f71"
state_closed = "#9d0006"
state_muted = "#928374"

[syntax]
keyword = "#9d0006"
string = "#79740e"

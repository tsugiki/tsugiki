[package]
name = "tsugiki-core"
description = "Tsugiki's core: git, GitHub, the store and the domain rules, with no UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# libtest would reject divan's options when `cargo bench` passes them on.
bench = false

[dependencies]
fs4.workspace = true
log.workspace = true
process-wrap.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
time.workspace = true
toml_edit.workspace = true
tree-sitter.workspace = true
tree-sitter-language.workspace = true
tree-sitter-c.workspace = true
tree-sitter-css.workspace = true
tree-sitter-html.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-make.workspace = true
tree-sitter-md.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rst.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-svelte-ng.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-yaml.workspace = true
ureq.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(not(windows))'.dependencies]
libc.workspace = true

[dev-dependencies]
divan.workspace = true
insta.workspace = true
tsugiki-test-git.workspace = true

[[bench]]
name = "about"
harness = false

[[bench]]
name = "diff"
harness = false

[[bench]]
name = "highlight"
harness = false

[[bench]]
name = "store"
harness = false

[lints]
workspace = true

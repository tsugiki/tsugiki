# The checks of ADR 0009, on every PR and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - name: Lint (ESLint, Prettier, rustfmt)
        run: npm run lint
      - name: Check (svelte-check, clippy)
        run: npm run check
      - name: Test (Vitest, cargo test, stale bindings)
        run: npm test
      - name: Install the Playwright browsers
        run: npx playwright install chromium webkit
      - name: Drive the built UI (Playwright)
        run: npm run e2e
      - name: Keep the Playwright traces of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.os }}
          path: ui/test-results
          if-no-files-found: ignore

  # The one check a ruleset requires, so jobs can be added here without changing the ruleset.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
